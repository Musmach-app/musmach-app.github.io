<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="app/icon.png">
<title>מוסמך · لوحة الإدارة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="import-tools.js"></script>
<script src="assets/ptr.js?v=2"></script>
<style>
:root{--bg:#EAF1FA;--surface:#fff;--ink:#0F1E33;--muted:#566A85;--line:#D2DEEC;--accent:#1554A8;--accent-soft:#DCE8F8;--ok:#1F8A4C;--ok-soft:#DDF2E5;--bad:#C2413A;--bad-soft:#F8E0DE;--amber-soft:#FBEBCF;
  --font:"IBM Plex Sans Arabic","IBM Plex Sans Hebrew",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs.grp{flex-direction:column;gap:8px;align-items:stretch}
.tabs .g{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs .g>span{font-size:12px;font-weight:600;opacity:.6;min-width:70px}
.trpick{border:1px solid var(--line);border-radius:12px;padding:0}
.trpick>summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
.trpick>summary::-webkit-details-marker{display:none}
.trpick>summary::after{content:"▾";opacity:.6}
.trpick[open]>summary::after{content:"▴"}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip input{display:none}
.chip:has(input:checked){background:var(--accent);color:#fff;border-color:var(--accent)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.subtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
label{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:760px){.grid2,.grid4{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{flex:1;min-width:140px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:600 14px var(--font);cursor:pointer;flex:none;min-width:0}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
tr.click{cursor:pointer}tr.click:hover{background:var(--accent-soft)}
.tbl{overflow-x:auto}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.off{background:var(--amber-soft);color:#8a5a0a}
.msg{border-radius:8px;padding:8px 12px;font-size:14px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.he{font-family:"IBM Plex Sans Hebrew",var(--font)}
.opt{display:flex;gap:8px;align-items:center}
.opt input[type=radio]{width:auto;flex:none}
.stat{font-size:28px;font-weight:600}
[hidden]{display:none!important}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.sumgrid div{background:#f4f6fa;border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center}.sumgrid b{font-size:22px}.sumgrid span{font-size:12px;color:#666}
.bars{display:flex;align-items:flex-end;gap:2px;height:140px;padding-top:6px}.bcol{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%;min-width:2px}.bcol i{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.bax{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.li{position:relative;display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;overflow:hidden}.li>span{position:relative;z-index:1}.lbar{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent-soft)}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
/* ===== Rishui admin panel — open this file in Chrome/Edge on your computer ===== */
// tracks and topics come from the database (tables "tracks" and "topics")
let TRACKS = [], TOPICS_BY = {}; // TOPICS_BY[track][topicId] = Hebrew name
let curTrack = localStorage.getItem("rs-track") || "nursing";
const TOPICS_OF = tr => TOPICS_BY[tr] || {};
const trackLabel = id => { const x = TRACKS.find(t => t.id === id); return x ? `${x.icon || ""} ${x.he}` : id; };
async function loadMeta() {
  const [{ data: tr }, { data: tp }] = await Promise.all([
    sb.from("tracks").select("*").order("sort"), sb.from("topics").select("*").order("sort")]);
  TRACKS = (tr || []).filter(t => !me || me.role === "admin" || (me.tracks || []).includes(t.id)); TOPICS_BY = {};
  for (const t of tp || []) (TOPICS_BY[t.track] = TOPICS_BY[t.track] || {})[t.id] = t.he;
  if (!TRACKS.find(t => t.id === curTrack) && TRACKS[0]) curTrack = TRACKS[0].id;
}
const root = document.getElementById("root");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const $ = id => document.getElementById(id);
const cfg = { url: localStorage.getItem("rs-url") || "https://bbslhbcmfjfjbvqqcebg.supabase.co", key: localStorage.getItem("rs-key") || "sb_publishable_-PUr33K468fu-ywZehsbZQ_QBQnHeQX" };
let sb = null, me = null, tab = "list", editing = null, listState = { topic: "", pub: "", q: "", page: 0, img: "", view: "table" }, flashMsg = null;

function msg(text, ok = true) { flashMsg = { text, ok }; }
function msgHtml() { const m = flashMsg; flashMsg = null; return m ? `<div class="msg ${m.ok ? "ok" : "bad"}">${esc(m.text)}</div>` : ""; }

/* ---------- setup + login ---------- */
function setup() {
  root.innerHTML = `<h1>لوحة إدارة מוסמך</h1>${msgHtml()}
  <div class="card"><h3>ربط المشروع (مرة وحدة)</h3>
    <p class="muted">من Supabase → Project Settings → API انسخ الـ Project URL والـ anon public key.</p>
    <label>Project URL</label><input id="u" dir="ltr" value="${esc(cfg.url)}" placeholder="https://xxxx.supabase.co">
    <label>anon public key</label><input id="k" dir="ltr" value="${esc(cfg.key)}">
    <button class="btn" id="s">حفظ</button></div>`;
  $("s").onclick = () => {
    cfg.url = $("u").value.trim(); cfg.key = $("k").value.trim();
    localStorage.setItem("rs-url", cfg.url); localStorage.setItem("rs-key", cfg.key); start();
  };
}
function login() {
  root.innerHTML = `<h1>لوحة إدارة מוסמך</h1>${msgHtml()}
  <form class="card" id="f"><h3>تسجيل دخول المدير</h3>
    <label>الإيميل</label><input id="e" type="email" dir="ltr">
    <label>الباسوورد</label><input id="p" type="password" dir="ltr">
    <button class="btn" type="submit">دخول</button>
    <button class="btn ghost" type="button" id="cfg">تغيير ربط المشروع</button></form>`;
  $("cfg").onclick = setup;
  $("f").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $("e").value.trim(), password: $("p").value });
    if (error) { msg("الإيميل أو الباسوورد غلط", false); return login(); }
    start();
  };
}
async function start() {
  if (!cfg.url || !cfg.key) return setup();
  sb = sb || supabase.createClient(cfg.url, cfg.key);
  const { data } = await sb.auth.getSession();
  if (!data.session) return login();
  const { data: p } = await sb.from("profiles").select("*").eq("id", data.session.user.id).single();
  if (!p || (p.role !== "admin" && p.role !== "editor")) {
    await sb.auth.signOut();
    msg("هاد الحساب مش مدير. شغّل أمر تعيين المدير من الدليل.", false); return login();
  }
  me = p; await loadMeta(); render();
}

/* ---------- layout ---------- */
function trPicker(cls, withAll) {
  return `<details class="trpick" data-cls="${cls}"><summary><span>اختار المسارات</span><span class="muted trn">ولا واحد</span></summary><div class="chips">${withAll ? `<label class="chip"><input type="checkbox" id="gall"><b>كل المسارات</b></label>` : ""}${TRACKS.map(t => `<label class="chip"><input type="checkbox" class="${cls}" value="${t.id}">${esc(trackLabel(t.id))}</label>`).join("")}</div></details>`;
}
function wirePicker(cls) {
  const d = document.querySelector(`.trpick[data-cls="${cls}"]`); if (!d) return;
  const upd = () => { const n = d.querySelectorAll("." + cls + ":checked").length; d.querySelector(".trn").textContent = n ? n + " مختار" : "ولا واحد"; };
  d.addEventListener("change", e => { if (e.target.id === "gall") d.querySelectorAll("." + cls).forEach(x => x.checked = e.target.checked); upd(); });
  return upd;
}
const TAB_GROUPS = [["📚 المحتوى", ["list","edit","import","summaries","pastex","tracks"]], ["👥 الناس", ["users","insights","codes","messages","reports"]], ["📊 عام", ["look","ann","stats","income"]]];
const EDITOR_TABS = ["list", "edit", "import", "stats"];   // what a limited admin may open
function render() {
  const allTabs = [["list","الأسئلة"],["edit", editing?.id ? "تعديل سؤال" : "إضافة سؤال"],["import","استيراد"],["reports","التبليغات"],["messages","الرسائل"],["codes","أكواد الدخول"],["tracks","المسارات والمواضيع"],["users","المستخدمين"],["summaries","📘 ملخصات"],["pastex","📝 امتحانات سابقة"],["ann","📢 إعلانات"],["look","🎨 شكل التطبيق"],["stats","أرقام"],["income","💰 الدخل"]];
  const isAdmin = me.role === "admin";
  const tabs = isAdmin ? allTabs : allTabs.filter(t => EDITOR_TABS.includes(t[0]));
  if (!tabs.some(t => t[0] === tab)) tab = "list";
  root.innerHTML = `<div class="top"><h1>لوحة إدارة מוסמך</h1><div class="row" style="flex:none"><span class="muted" dir="ltr">${esc(me.email)}</span><button class="btn ghost" id="rf" title="تحديث">🔄 تحديث</button><button class="btn ghost" id="out">خروج</button></div></div>
  <div class="row" style="justify-content:flex-start"><label style="flex:none">المسار:</label><select id="ctr" style="flex:none;min-width:200px">${TRACKS.map(t => `<option value="${t.id}" ${t.id===curTrack?"selected":""}>${esc(trackLabel(t.id))}</option>`).join("")}</select></div>
  <div class="tabs grp">${TAB_GROUPS.map(([gn, ks]) => { const g = tabs.filter(t => ks.includes(t[0])); return g.length ? `<div class="g"><span>${gn}</span>${g.map(([k,n]) => `<button data-t="${k}" class="${tab===k?"on":""}">${n}</button>`).join("")}</div>` : ""; }).join("")}</div>
  ${msgHtml()}<div id="body"></div>`;
  root.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; if (tab === "edit" && b.textContent === "إضافة سؤال") editing = null; render(); });
  $("ctr").onchange = () => { curTrack = $("ctr").value; localStorage.setItem("rs-track", curTrack); listState.topic = ""; editing = null; render(); };
  $("rf").onclick = () => { $("rf").disabled = true; render(); };
  $("out").onclick = async () => { await sb.auth.signOut(); me = null; start(); };
  ({ list: viewList, edit: viewEdit, import: viewImport, reports: viewReports, messages: viewMessages, codes: viewCodes, tracks: viewTracks, users: viewUsers, insights: viewInsights, summaries: viewSummaries, pastex: viewPastEx, ann: viewAnn, look: viewLook, stats: viewStats, income: viewIncome })[tab]();
}


/* ---------- summaries (ملخصات) ---------- */
async function viewSummaries() {
  const { data } = await sb.from("summaries").select("id,topic,title,sort,published").eq("track", curTrack).order("topic").order("sort").order("id");
  const rows = data || [], pub = rows.filter(r => r.published).length;
  $("body").innerHTML = `<div class="card"><h3>ملخصات مسار ${esc(trackLabel(curTrack))}: ${pub} مفتوح من ${rows.length}</h3>
    <p class="muted">الملخصات مقفولة عن الطلاب (🔒 ייפתח שבוע לפני המבחן) لحد ما تفتحها. بتفتح فقط لمن عنده اشتراك.</p>
    <div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" id="sopen" style="flex:none">🔓 افتح كل ملخصات المسار</button><button class="btn ghost" id="sclose" style="flex:none">🔒 سكّر كل ملخصات المسار</button></div></div>
    <form class="card" id="sf"><h3>ملخص جديد</h3>
    <div class="row"><div><label>العنوان (مرض)</label><input id="stt" required placeholder="מחלה"></div><div><label>الموضوع</label><input id="stp" placeholder="مثلاً: קרדיולוגיה"></div><div style="max-width:120px"><label>الترتيب</label><input id="sso" type="number" value="0"></div></div>
    <label>النص (## عنوان فرعي، - نقطة، وباقي السطور فقرات)</label><textarea id="sbd" rows="9" required placeholder="## סימנים עיקריים&#10;- ...&#10;## טיפול&#10;- ..."></textarea>
    <button class="btn" type="submit" style="align-self:flex-start">إضافة (مقفول)</button></form>
    <div class="card"><h3>الملخصات</h3><div class="tbl"><table><thead><tr><th>العنوان</th><th>الموضوع</th><th>الحالة</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.title)}</td><td>${esc(r.topic || "")}</td><td>${r.published ? "🔓 مفتوح" : "🔒 مقفول"}</td><td><button class="btn ghost" data-sid="${r.id}" data-p="${r.published ? 0 : 1}">${r.published ? "سكّر" : "افتح"}</button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">ما في ملخصات لهالمسار لسا.</td></tr>`}</tbody></table></div></div>`;
  const setAll = async v => { const { error } = await sb.from("summaries").update({ published: v }).eq("track", curTrack); msg(error ? error.message : (v ? "انفتحت كل الملخصات" : "انسكرت كل الملخصات"), !error); render(); };
  $("sopen").onclick = () => confirm("افتح كل ملخصات هالمسار للطلاب؟") && setAll(true);
  $("sclose").onclick = () => setAll(false);
  document.querySelectorAll("[data-sid]").forEach(b => b.onclick = async () => { const { error } = await sb.from("summaries").update({ published: b.dataset.p === "1" }).eq("id", b.dataset.sid); if (error) msg(error.message, false); render(); });
  $("sf").onsubmit = async e => { e.preventDefault(); const { error } = await sb.from("summaries").insert({ track: curTrack, title: $("stt").value.trim(), topic: $("stp").value.trim() || null, body: $("sbd").value, sort: +$("sso").value || 0, published: false }); msg(error ? error.message : "انضاف الملخص (مقفول)", !error); render(); };
}

/* ---------- past exams (امتحانات سابقة) ---------- */
async function viewPastEx() {
  const { data: ss } = await sb.from("exam_sessions").select("*").eq("track", curTrack).order("year", { ascending: false }).order("month", { ascending: false, nullsFirst: false });
  const cnt = {};
  for (let from = 0; ; from += 1000) {
    const { data: qs } = await sb.from("questions").select("session_id,published").eq("track", curTrack).not("session_id", "is", null).order("id").range(from, from + 999);
    (qs || []).forEach(q => { const c = cnt[q.session_id] || (cnt[q.session_id] = { n: 0, p: 0 }); c.n++; if (q.published) c.p++; });
    if (!qs || qs.length < 1000) break;
  }
  const list = ss || [];
  const live = s => s.published && (cnt[s.id]?.p || 0) > 0;
  $("body").innerHTML = `<div class="card"><h3>امتحانات سابقة (שחזורים) لمسار ${esc(trackLabel(curTrack))}: ${list.filter(live).length} ظاهر للطلاب من ${list.length}</h3>
    <p class="muted">"افتح" بينشر الجلسة وكل أسئلتها، و"سكّر" بيخفيها. الطالب بيشوف الامتحان بس إذا الجلسة منشورة وفيها أسئلة منشورة. إذا ما في ولا امتحان ظاهر بيطلع 🔒 בקרוב.</p>
    <div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" id="paopen" style="flex:none">🔓 افتح الكل</button><button class="btn ghost" id="paclose" style="flex:none">🔒 سكّر الكل</button></div>
    <div class="tbl"><table><thead><tr><th>الامتحان</th><th>أسئلة منشورة / كل</th><th>الحالة</th><th></th></tr></thead><tbody>${list.map(s => { const c = cnt[s.id] || { n: 0, p: 0 }; return `<tr><td>${esc((s.month ? s.month + "/" : "") + s.year)} ${esc(s.label || "")}</td><td dir="ltr">${c.p} / ${c.n}</td><td>${live(s) ? "🔓 ظاهر" : "🔒 مخفي"}</td><td><button class="btn ghost" data-xid="${s.id}" data-p="${live(s) ? 0 : 1}">${live(s) ? "سكّر" : "افتح"}</button></td></tr>`; }).join("") || `<tr><td colspan="4" class="muted">ما في جلسات لهالمسار.</td></tr>`}</tbody></table></div></div>`;
  const setIds = async (ids, v) => {
    if (!ids.length) return;
    const a = await sb.from("exam_sessions").update({ published: v }).in("id", ids);
    const b = await sb.from("questions").update({ published: v }).in("session_id", ids);
    const err = a.error || b.error; msg(err ? err.message : (v ? "انفتح" : "انسكر"), !err); render();
  };
  $("paopen").onclick = () => confirm("افتح كل امتحانات هالمسار للطلاب؟") && setIds(list.map(s => s.id), true);
  $("paclose").onclick = () => setIds(list.map(s => s.id), false);
  document.querySelectorAll("[data-xid]").forEach(b => b.onclick = () => setIds([+b.dataset.xid], b.dataset.p === "1"));
}

/* ---------- list ---------- */
const PAGE = 50;
const imgSrc = p => /^(https?:)?\/\//.test(p) ? p : "app/" + String(p).replace(/^\/+/, "");
async function viewList() {
  const b = $("body"), s = listState;
  b.innerHTML = `<div class="card"><div class="row">
    <select id="ft"><option value="">كل المواضيع</option>${Object.entries(TOPICS_OF(curTrack)).map(([k,n]) => `<option value="${k}" ${s.topic===k?"selected":""}>${esc(n)}</option>`).join("")}</select>
    <select id="fp"><option value="">منشور وغير منشور</option><option value="1" ${s.pub==="1"?"selected":""}>منشور</option><option value="0" ${s.pub==="0"?"selected":""}>غير منشور</option></select>
    <select id="fi"><option value="">مع صورة وبدون</option><option value="1" ${s.img==="1"?"selected":""}>فيها صورة فقط</option><option value="0" ${s.img==="0"?"selected":""}>بدون صورة</option></select>
    <select id="fv"><option value="table" ${s.view!=="cards"?"selected":""}>عرض جدول</option><option value="cards" ${s.view==="cards"?"selected":""}>🖼 عرض بطاقات (سؤال + صورة)</option></select>
    <input id="fq" placeholder="بحث بنص السؤال" value="${esc(s.q)}">
    <button class="btn" id="go">بحث</button><button class="btn ghost" id="new">+ سؤال جديد</button><button class="btn" id="puball" style="display:none"></button></div>
    <div class="tbl"><table><thead><tr><th>#</th><th>الموضوع</th><th>السؤال (עברית)</th><th>الحالة</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="muted">بحمّل…</td></tr></tbody></table></div>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" id="pv">السابق</button><span class="muted" id="pg"></span><button class="btn ghost" id="nx">التالي</button></div></div>`;
  $("go").onclick = () => { s.topic = $("ft").value; s.pub = $("fp").value; s.img = $("fi").value; s.view = $("fv").value; s.q = $("fq").value.trim(); s.page = 0; viewList(); };
  $("fv").onchange = () => { s.view = $("fv").value; viewList(); };

function validate(r) {
  const p = [];
  if (!TOPICS_OF(r.track)[r.topic]) p.push(`موضوع غير معروف بمسار ${r.track}: ${r.topic}`);
  if (!(r.answer >= 0 && r.answer <= r.he.o.length - 1)) p.push("لازم تختار الجواب الصحيح");
  for (const [l,n] of [["he","العبري"],["en","الإنجليزي"]]) {
    if (!r[l].q) p.push(`نص السؤال ب${n} فاضي`);
    if (r[l].o.length < 4 || r[l].o.length > 5 || r[l].o.some(o => !o)) p.push(`لازم ٤ خيارات ب${n}`);
    if (!r[l].e) p.push(`الشرح ب${n} فاضي`);
  }
  if (!r.source) p.push("المصدر فاضي");
  return p;
}

/* ---------- import ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function rowsFromCSV(text) {
  return ImportTools.rowsFromTable(parseCSV(text.replace(/^\uFEFF/, "")), importCtx()).rows;
}
function rowsFromXLSX(buf) {
  if (!window.XLSX) throw new Error("قارئ ملفات Excel ما انحمّل. افحص الإنترنت وجرّب كمان مرة.");
  const wb = XLSX.read(buf, { type: "array" });
  // the sheet with the questions: "שאלות" in our template, otherwise the first sheet that has a known header
  const names = ["שאלות", ...wb.SheetNames];
  for (const n of names) {
    const ws = wb.Sheets[n]; if (!ws) continue;
    const res = ImportTools.rowsFromTable(XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" }), importCtx());
    if (res.layout) return res.rows;
  }
  throw new Error("ما لقيت ورقة فيها أعمدة الأسئلة (השאלה أو q_he).");
}
function rowsFromJSON(text) {
  const arr = JSON.parse(text);
  return arr.map((x, n) => ({ line: n + 1, track: x.track || curTrack, topic: x.topic ?? x.t, answer: x.answer ?? x.a, he: x.he, en: x.en, terms: x.terms || [], source: x.source ?? x.ref ?? "", is_free: !!x.is_free }));
}
const importCtx = () => ({ curTrack, tracks: TRACKS, topicsBy: TOPICS_BY });
async function existingQuestions(tracks) {
  let all = [];
  for (const tr of tracks) {
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from("questions").select("id,he").eq("track", tr).order("id").range(from, from + 999);
      if (error) throw error;
      all = all.concat(data.map((x) => ({ id: x.id, q: x.he?.q })));
      if (data.length < 1000) break;
    }
  }
  return all;
}
function viewImport() {
  $("body").innerHTML = `<div class="card"><h3>استيراد أسئلة</h3>

    let existing = [];

    const { inFile, inDb } = ImportTools.findDuplicates(rows, existing);
    const problems = rows.map((r, i) => [r.line ?? i + 2, validate(r)]).filter(([, p]) => p.length);

    const a = document.createElement("a");

// adds in small groups; if a group fails, its rows are tried one by one so one bad row doesn't stop the rest
async function runImport(list) {
  $("go").disabled = true;
  const pub = $("pub").checked, clean = (r) => { const { line, heOnly, ...x } = r; return { ...x, published: pub }; };
  let added = 0; const failed = [];
  for (let i = 0; i < list.length; i += 50) {
    const chunk = list.slice(i, i + 50);
    $("go").textContent = `بضيف… ${added}/${list.length}`;
    const { error } = await sb.from("questions").insert(chunk.map(clean));
    if (!error) { added += chunk.length; continue; }
    for (const r of chunk) {
      const { error: e1 } = await sb.from("questions").insert(clean(r));
      if (e1) failed.push([r.line, e1.message]); else added++;
    }
  }
  $("pre").insertAdjacentHTML("beforeend", `<div class="msg ${failed.length ? "bad" : ""}"><b>انضاف ${added} سؤال${pub ? " (منشورين)" : " (مسودة)"}.</b>${failed.length ? `<br>ما انضافوا ${failed.length}:<br>${failed.map(([n, m]) => `سطر ${n}: ${esc(m)}`).join("<br>")}` : ""}</div>`);
  $("go").remove();
  msg(`انضاف ${added} سؤال`);
}

      <div style="flex:1"><label>الرابط (إذا اخترت رابط خارجي)</label><input id="b_url" dir="ltr" placeholder="https://…" value="${esc(b.url || "")}"></div></div>
    <div class="row"><div style="flex:1"><label>نص الزر (עברית) — فاضي = البطاقة كلها بتنكبس</label><input id="b_hbtn" dir="rtl" value="${esc(b.he.btn || "")}"></div><div style="flex:1"><label>Button (English)</label><input id="b_ebtn" dir="ltr" value="${esc(b.en.btn || "")}"></div></div>
    <div class="row"><div><label>وين يطلع</label><select id="b_place"><option value="home">الرئيسية</option><option value="all">فوق كل الصفحات</option><option value="plans">صفحة الاشتراك</option></select></div>
      <div><label>بأي مكان</label><select id="b_plat"><option value="web">🌐 الموقع بس</option><option value="all">📱🌐 الآيفون والموقع</option><option value="app">📱 الآيفون بس</option></select></div>
      <div><label>لون الخلفية (فاضي = أبيض عادي)</label><div class="row"><input type="color" id="b_colp" value="${esc(b.color || "#1554A8")}" style="width:52px;padding:2px"><input id="b_col" dir="ltr" value="${esc(b.color || "")}" placeholder="#1554A8" style="width:110px"></div></div>
      <div><label>من تاريخ</label><input type="date" id="b_from" value="${esc(b.from || "")}"></div><div><label>لحد تاريخ</label><input type="date" id="b_until" value="${esc(b.until || "")}"></div></div>
    <label>لأي مسارات (ولا واحد = الكل)</label><div class="chips" style="padding:0">${TRACKS.map(t => `<label class="chip"><input type="checkbox" class="b_tr" value="${t.id}" ${(b.tracks || []).includes(t.id) ? "checked" : ""}>${esc(trackLabel(t.id))}</label>`).join("")}</div>
    <label>هيك بيطلع (تقريباً):</label><div id="b_prev"></div></div>`;
  $("b_place").value = b.place || "home"; $("b_plat").value = b.platform || "all";
  const read = () => {
    b.active = $("b_on").checked; b.he.title = $("b_ht").value.trim(); b.en.title = $("b_et").value.trim(); b.he.body = $("b_hb").value.trim(); b.en.body = $("b_eb").value.trim();
    b.he.btn = $("b_hbtn").value.trim(); b.en.btn = $("b_ebtn").value.trim(); b.image = $("b_img").value.trim() || undefined;
    const a = $("b_act").value; if (a === "url") { b.url = $("b_url").value.trim() || undefined; delete b.action; } else { delete b.url; if (a) b.action = a; else delete b.action; }
    b.place = $("b_place").value; b.platform = $("b_plat").value; b.color = $("b_col").value.trim() || undefined; b.from = $("b_from").value || undefined; b.until = $("b_until").value || undefined;
    b.tracks = [...document.querySelectorAll(".b_tr:checked")].map(x => x.value);
    for (const k of ["he", "en"]) for (const f of ["title", "body", "btn"]) if (!b[k][f]) delete b[k][f];
    const c = b.color, x = b.he;
    $("b_prev").innerHTML = `<div dir="rtl" style="max-width:420px;border-radius:18px;padding:14px 16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;${c ? `background:${esc(c)};color:#fff;border-color:transparent` : "background:#fff"}">${b.image ? `<img src="${esc(b.image)}" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px">` : ""}${x.title ? `<b>${esc(x.title)}</b>` : ""}${x.body ? `<p style="margin:0;white-space:pre-line;opacity:.88">${esc(x.body)}</p>` : ""}${(b.url || b.action) && x.btn ? `<span class="btn" style="align-self:flex-start">${esc(x.btn)}</span>` : ""}</div>`;
    lookTouch();
  };
  $("lbody").querySelectorAll("input,textarea,select").forEach(e => { e.oninput = read; e.onchange = read; });
  $("b_colp").oninput = () => { $("b_col").value = $("b_colp").value; read(); };
  bindUploads(read); read();
  $("bback").onclick = () => { lookEditBan = null; viewLook(); };
}

/* colours */
function lookColors() {
  const C = look.colors || (look.colors = { light: {}, dark: {} }); C.light = C.light || {}; C.dark = C.dark || {};
  const row = (mode, k) => `<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:6px 0"><span>${LOOK_COLORS[k]} <span class="muted" dir="ltr">--${k}</span></span>
    <span class="row"><input type="color" data-cp="${mode}:${k}" value="${esc(/^#[0-9a-f]{6}$/i.test(C[mode][k] || "") ? C[mode][k] : "#888888")}" style="width:46px;padding:2px">
    <input data-ct="${mode}:${k}" dir="ltr" value="${esc(C[mode][k] || "")}" placeholder="الأصلي" style="width:110px"><button class="btn ghost" data-cr="${mode}:${k}" title="رجّع الأصلي">↺</button></span></div>`;
  $("lbody").innerHTML = `<div class="card"><h3>🎨 الألوان</h3><p class="muted">فاضي = لون التطبيق الأصلي (وكل مسار إله لونه). إذا حطيت لون هون بيغطّي على كل المسارات. ألوان مسار معيّن من تبويب 🖼️ المسارات.</p>
    <h4 style="margin:6px 0">☀️ الوضع الفاتح</h4>${Object.keys(LOOK_COLORS).map(k => row("light", k)).join("")}
    <h4 style="margin:12px 0 6px">🌙 الوضع الغامق</h4>${Object.keys(LOOK_COLORS).map(k => row("dark", k)).join("")}</div>`;
  const set = (mk, v) => { const [m, k] = mk.split(":"); if (v) C[m][k] = v; else delete C[m][k]; lookTouch(); };
  document.querySelectorAll("[data-cp]").forEach(e => e.oninput = () => { document.querySelector(`[data-ct="${e.dataset.cp}"]`).value = e.value; set(e.dataset.cp, e.value); });
  document.querySelectorAll("[data-ct]").forEach(e => e.oninput = () => set(e.dataset.ct, e.value.trim()));
  document.querySelectorAll("[data-cr]").forEach(e => e.onclick = () => { set(e.dataset.cr, ""); viewLook(); });
}

/* settings: things the app reads from the server (look.cfg), plus a few switches saved straight away */
const PROF_N = { nursing: "סיעוד", medicine: "רפואה", physio: "פיזיותרפיה", ot: "ריפוי בעיסוק", radiography: "דימות רפואי", pharmacy: "רוקחות" };
const YEAR_N = ["א׳", "ב׳", "ג׳", "ד׳"];
async function lookSettings() {
  const C = look.cfg || (look.cfg = {});
  const N = C.nudge || (C.nudge = {}), PF = C.profs || (C.profs = { nursing: true }), FR = C.free || (C.free = {});
  $("lbody").innerHTML = `<div class="card muted">بحمّل…</div>`;
  const [{ data: setg }, { data: fc }, { data: crs }] = await Promise.all([
    sb.from("app_settings").select("students_open").eq("id", 1).maybeSingle(),
    sb.rpc("free_counts"),
    sb.from("tracks").select("id,he,icon,profession,year,coming_soon,access,sort").eq("kind", "course").order("sort")]);
  const freeNow = Object.fromEntries((fc || []).map(r => [r.track, r.n]));
  const tracksAll = TRACKS.filter(t => t.kind !== "course" && t.id !== "archive_medicine");
  const courses = crs || [];
  const on = (v, d) => v === undefined ? d : v;
  const box = (h, body) => `<div class="card" style="gap:10px"><h3>${h}</h3>${body}</div>`;
  $("lbody").innerHTML =
    box("🎓 مسار الطلاب", `<p class="muted">هاد بيتغيّر فوراً (بدون 💾).</p><div class="row" style="justify-content:flex-start"><span class="pill ${setg?.students_open ? "" : "off"}">${setg?.students_open ? "🟢 مفتوح: كرت «סטודנטים» ظاهر بأول شاشة" : "⚪ مسكّر: بس «בוגרים» ظاهر"}</span><button class="btn ghost" id="sto" style="flex:none">${setg?.students_open ? "سكّر" : "افتح"}</button></div>
      <b>المهن المفتوحة للطلاب</b><p class="muted">الباقي بيطلع «בקרוב». المهنة بدها كورسات (تحت) عشان يكون فيها إشي.</p>
      <div class="row" style="justify-content:flex-start;flex-wrap:wrap">${Object.entries(PROF_N).map(([k, n]) => `<label style="display:flex;gap:6px;align-items:center;flex:none"><input type="checkbox" data-pf="${k}" style="width:auto" ${PF[k] ? "checked" : ""}><span class="he">${n}</span></label>`).join("")}</div>`) +
    box("📚 كورسات الطلاب", `<p class="muted">كل كورس إله مواضيع وأسئلة (بتختاره من فوق كمسار). «בקרוב» = ظاهر ومقفول. هاد بيتغيّر فوراً.</p>
      <div class="tbl"><table><thead><tr><th>الكورس</th><th>المهنة</th><th>سنة</th><th>أسئلة ببلاش</th><th>الحالة</th></tr></thead><tbody>${courses.map(c => `<tr><td class="he">${esc(c.icon || "")} ${esc(c.he)}</td><td class="he">${esc(PROF_N[c.profession] || c.profession || "")}</td><td>${YEAR_N[(c.year || 1) - 1] || ""}</td><td>${freeNow[c.id] || 0}</td><td><button class="btn ghost" data-cs="${esc(c.id)}" data-v="${c.coming_soon ? 0 : 1}" style="flex:none">${c.coming_soon ? "🟡 בקרוב → افتح" : "🟢 مفتوح → בקרוב"}</button></td></tr>`).join("") || `<tr><td colspan="5" class="muted">ما في كورسات</td></tr>`}</tbody></table></div>
      <form id="fc" class="row" style="flex-wrap:wrap"><input id="ci" dir="ltr" placeholder="id, e.g. stn1phys" style="max-width:160px"><input id="ch" dir="rtl" placeholder="اسم الكورس بالعبري"><input id="ce" dir="ltr" placeholder="Course name in English"><input id="cc" placeholder="أيقونة 🫁" style="max-width:90px">
        <select id="cp">${Object.entries(PROF_N).map(([k, n]) => `<option value="${k}">${n}</option>`).join("")}</select><select id="cy">${YEAR_N.map((y, i) => `<option value="${i + 1}">سنة ${y}</option>`).join("")}</select><button class="btn" type="submit">➕ كورس جديد (בקרוב)</button></form>
      <p class="muted">الكورس الجديد بيطلع «בקרוב». ضيفله مواضيع وأسئلة من تبويب المسارات، وبعدين افتحه.</p>`) +
    box("🎁 الأسئلة المجانية", `<p class="muted">كم سؤال ببلاش بكل مسار. «طبّق» بيغيّر الأسئلة المجانية فوراً، والنص بالتطبيق («30 שאלות חינם») بيتغيّر لحاله بعد 💾.</p>
      ${[...tracksAll, ...courses].map(t => `<div class="row" style="justify-content:flex-start"><span class="he" style="min-width:160px">${esc(t.icon || "")} ${esc(t.he)}</span><input type="number" min="0" max="500" data-fr="${esc(t.id)}" value="${freeNow[t.id] || 0}" style="max-width:90px"><button class="btn ghost" data-fra="${esc(t.id)}" style="flex:none">طبّق</button></div>`).join("")}`) +
    box("🎓 الامتحان النهائي للكورس (מבחן מסכם)", `<div class="row" style="justify-content:flex-start"><label>عدد الأسئلة <input type="number" id="exn" min="10" max="150" value="${on(C.examN, 50)}" style="max-width:90px"></label><label>ثواني لكل سؤال <input type="number" id="exs" min="30" max="180" value="${on(C.examSec, 72)}" style="max-width:90px"></label></div><p class="muted">الوقت الكلي بيطلع بالتطبيق لحاله (مثلاً 50 × 72 ثانية = 60 دقيقة).</p>`) +
    box("👋 أول سؤال بعد التسجيل", `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fq" style="width:auto" ${on(C.firstQ, true) ? "checked" : ""}> الבוגר الجديد بيدخل على سؤال أول ما يسجّل (بدل صفحة التعريف)</label>`) +
    box("📣 تذكير المستخدمين الجداد", `<p class="muted">مرة وحدة لكل مستخدم سجّل امبارح وما اشترك وحلّ 5 أسئلة أو أقل. هاد بيشتغل من السيرفر (حتى على النسخة القديمة).</p>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="non" style="width:auto" ${N.on === false ? "" : "checked"}> شغّال</label>
      <label>الساعة <select id="nhr">${Array.from({ length: 13 }, (_, i) => i + 9).map(h => `<option value="${h}" ${on(N.hour, 18) == h ? "selected" : ""}>${h}:00</option>`).join("")}</select></label>
      <label>العنوان <input id="nti" dir="rtl" value="${esc(N.title || "")}" placeholder="מוסמך"></label>
      <label>لما ما حلّ ولا سؤال <input id="nt0" dir="rtl" value="${esc(N.t0 || "")}" placeholder="מחכות לך {left} שאלות חינם 🎯 מתחילים עם 5 בלבד?"></label>
      <label>لما حلّ سؤال واحد <input id="nt1" dir="rtl" value="${esc(N.t1 || "")}" placeholder="ענית על שאלה אחת – נשארו לך {rem} 💪"></label>
      <label>لما حلّ كم سؤال <input id="ntn" dir="rtl" value="${esc(N.tn || "")}" placeholder="ענית על {n} שאלות – נשארו לך {rem} 💪"></label>
      <p class="muted">فاضي = النص الأصلي (المكتوب باللون الفاتح). <span dir="ltr">{n}</span> = كم سؤال حلّ · <span dir="ltr">{left}</span> = كم ضايلّه · <span dir="ltr">{rem}</span> = «עוד X שאלות חינם».</p>
      <div id="nst" class="muted">بحمّل آخر التذكيرات…</div>`);
  // instant switches
  $("sto").onclick = async () => { const { error } = await sb.from("app_settings").update({ students_open: !setg?.students_open }).eq("id", 1); if (error) alert(error.message); lookSettings(); };
  document.querySelectorAll("[data-cs]").forEach(b => b.onclick = async () => { const { error } = await sb.from("tracks").update({ coming_soon: b.dataset.v === "1" }).eq("id", b.dataset.cs); if (error) alert(error.message); lookSettings(); });
  $("fc").onsubmit = async e => {
    e.preventDefault();
    const id = $("ci").value.trim().toLowerCase(), he = $("ch").value.trim(), en = $("ce").value.trim();
    if (!/^[a-z0-9_]+$/.test(id) || !he || !en) return alert("عبّي المعرّف (أحرف إنجليزية صغيرة) والاسمين");
    const access = courses.find(c => c.profession === $("cp").value)?.access || null;
    const { error } = await sb.from("tracks").insert({ id, he, en, icon: $("cc").value.trim() || "📘", kind: "course", profession: $("cp").value, year: +$("cy").value, access, coming_soon: true, active: false, sort: (courses.length + 1) * 10 });
    if (error) return alert(error.message);
    await loadMeta(); lookSettings();
  };
  document.querySelectorAll("[data-fra]").forEach(b => b.onclick = async () => {
    const id = b.dataset.fra, n = +document.querySelector(`[data-fr="${id}"]`).value;
    if (!(n >= 0)) return;
    if (!confirm(`يصير ${n} سؤال ببلاش بـ«${trackLabel(id)}»؟`)) return;
    const { data, error } = await sb.rpc("set_free_count", { p_track: id, p_n: n });
    if (error) return alert(error.message);
    FR[id] = data; lookTouch(); alert(`✅ صار ${data} سؤال ببلاش. اكبس 💾 عشان النص بالتطبيق يتغيّر كمان.`); lookSettings();
  });
  // saved with 💾
  document.querySelectorAll("[data-pf]").forEach(e => e.onchange = () => { if (e.checked) PF[e.dataset.pf] = true; else delete PF[e.dataset.pf]; lookTouch(); });
  $("exn").oninput = () => { C.examN = +$("exn").value || 50; lookTouch(); };
  $("exs").oninput = () => { C.examSec = +$("exs").value || 72; lookTouch(); };
  $("fq").onchange = () => { C.firstQ = $("fq").checked; lookTouch(); };
  $("non").onchange = () => { N.on = $("non").checked; lookTouch(); };
  $("nhr").onchange = () => { N.hour = +$("nhr").value; lookTouch(); };
  for (const [id, k] of [["nti", "title"], ["nt0", "t0"], ["nt1", "t1"], ["ntn", "tn"]]) $(id).oninput = () => { const v = $(id).value; if (v.trim()) N[k] = v; else delete N[k]; lookTouch(); };
  const { data: ns } = await sb.from("nudge_sent").select("sent_at,ok").order("sent_at", { ascending: false }).limit(200);
  if ($("nst")) $("nst").textContent = ns?.length ? `آخر 7 أيام: انبعت ${(ns || []).filter(x => x.ok && Date.now() - Date.parse(x.sent_at) < 7 * 864e5).length} تذكير.` : "لسا ما انبعت ولا تذكير.";
}

/* card lessons for students: saved straight to the lessons table (no 💾 needed) */
let lesEdit = null;
async function lookLessons() {
  const courses = TRACKS.filter(t => t.kind === "course");
  const cur = courses.find(c => c.id === curTrack)?.id || courses[0]?.id;
  if (!cur) { $("lbody").innerHTML = `<div class="card muted">ما في كورسات.</div>`; return; }
  const { data: rows, error } = await sb.from("lessons").select("id,topic,sort,title_he,icon,cards,is_free,published").eq("track", cur).order("sort");
  if (error) { $("lbody").innerHTML = `<div class="card msg bad">${esc(error.message)}</div>`; return; }
  if (lesEdit) {
    const l = lesEdit === "new" ? { id: null, topic: "", sort: ((rows || []).length + 1) * 10, title_he: "", icon: "📘", cards: [], is_free: false, published: false } : rows.find(r => r.id === lesEdit);
    $("lbody").innerHTML = `<div class="card" style="gap:8px"><div class="row" style="justify-content:space-between"><h3>✏️ ${l.id ? "تعديل درس" : "درس جديد"} · ${esc(trackLabel(cur))}</h3><button class="btn ghost" id="lback" style="flex:none">→ رجوع</button></div>
      <div class="row"><input id="lt" dir="rtl" placeholder="عنوان الدرس" value="${esc(l.title_he)}"><input id="li" placeholder="أيقونة" value="${esc(l.icon || "")}" style="max-width:80px"><input id="ltp" dir="ltr" placeholder="topic id (ph04)" value="${esc(l.topic || "")}" style="max-width:130px"><input id="ls" type="number" value="${l.sort}" style="max-width:80px" title="الترتيب"></div>
      <p class="muted">البطاقات (JSON). كل بطاقة: <span dir="ltr">{"k","t","p","flow":[],"table":{"h":[],"r":[[]]},"list":[],"tip","warn"}</span> — والأخيرة <span dir="ltr">"type":"sum"</span> مع <span dir="ltr">"pts"</span> و <span dir="ltr">"q":{"q","o":[],"a"}</span>. نص بين ** ** بيطلع عريض.</p>
      <textarea id="lj" dir="ltr" style="min-height:420px;font-family:monospace;font-size:12.5px">${esc(JSON.stringify(l.cards, null, 1))}</textarea>
      <div class="row" style="justify-content:flex-start"><button class="btn" id="lsv" style="flex:none">💾 احفظ الدرس</button>${l.id ? `<button class="btn danger" id="ldel" style="flex:none">🗑 احذف</button>` : ""}</div></div>`;
    $("lback").onclick = () => { lesEdit = null; lookLessons(); };
    $("lsv").onclick = async () => {
      let cards; try { cards = JSON.parse($("lj").value); if (!Array.isArray(cards)) throw new Error("لازم تكون قائمة [ ]"); } catch (e) { return alert("في غلط بالـJSON: " + e.message); }
      const row = { track: cur, title_he: $("lt").value.trim(), icon: $("li").value.trim() || null, topic: $("ltp").value.trim() || null, sort: +$("ls").value || 0, cards, updated_at: new Date().toISOString() };
      if (!row.title_he) return alert("اكتب عنوان");
      const { error } = l.id ? await sb.from("lessons").update(row).eq("id", l.id) : await sb.from("lessons").insert(row);
      if (error) return alert(error.message);
      lesEdit = null; lookLessons();
    };
    if ($("ldel")) $("ldel").onclick = async () => { if (!confirm("تحذف الدرس؟ ما برجع.")) return; const { error } = await sb.from("lessons").delete().eq("id", l.id); if (error) return alert(error.message); lesEdit = null; lookLessons(); };
    return;
  }
  $("lbody").innerHTML = `<div class="card" style="gap:8px"><div class="row" style="justify-content:space-between"><h3>⚡ חזרה מהירה (دروس البطاقات)</h3><button class="btn" id="lnew" style="flex:none">➕ درس جديد</button></div>
    <div class="row" style="justify-content:flex-start"><label style="flex:none">الكورس:</label><select id="lcr" style="flex:none">${courses.map(c => `<option value="${c.id}" ${c.id === cur ? "selected" : ""}>${esc(c.icon || "")} ${esc(c.he)}</option>`).join("")}</select></div>

      [`إجابات آخر ${statDays} يوم`, num(ap.answers), `${acc}% صحيحة`], ["طلاب شغّالين بالفترة", num(ap.active)],
      ["امتحانات خلصت", num(ap.exams_done)], ["مهمات يومية خلصت", num(ap.missions_done)]]);
    h += `<div class="card"><b>كل يوم: <span style="color:var(--ok)">■</span> سجّلوا جديد · <span style="color:var(--accent)">■</span> حلّوا أسئلة</b>${bars(ap.signups_by_day, ["n", "a"], ["var(--ok)", "var(--accent)"])}</div>`;
    h += `<div class="card"><b>أصعب المواضيع (أقل نسبة إجابات صحيحة)</b>${ap.hard_topics.length ? `<div class="tbl"><table><thead><tr><th>الموضوع</th><th>إجابات</th><th>صحيحة</th></tr></thead><tbody>${ap.hard_topics.map(t => `<tr><td class="he">${esc(trackLabel(t.track))} · ${esc(TOPICS_OF(t.track)[t.k] || t.k)}</td><td>${num(t.n)}</td><td>${t.pct}%</td></tr>`).join("")}</tbody></table></div>` : `<span class="muted">بتظهر لما يكون في 10 إجابات على الأقل بالموضوع.</span>`}</div>`;
  }
  h += `<h3>📦 عام</h3>` + cardsHtml(me.role === "admin" ? [["كل المستخدمين", num(u.count)], ["اشتراكات فعّالة", num(new Set((a.data || []).map(x => x.user_id)).size)], ["كل الأسئلة", num(q.count)], ["منشورة", num(p.count)]] : [["كل الأسئلة", num(q.count)], ["منشورة", num(p.count)]]);
  if (me.role !== "admin") { $("st").innerHTML = h; $("st").style.cssText = "display:flex;flex-direction:column;gap:12px"; return; }
  {
    const { data: pur } = await sb.from("purchases").select("price_usd,net_usd,sandbox,purchased_at,track").eq("sandbox", false).order("purchased_at", { ascending: false }).limit(5000);
    const rows = pur || [], usd = x => "$" + (Math.round(x * 100) / 100).toLocaleString("en-US");
    const netOf = x => Number(x.net_usd ?? (x.price_usd || 0) * 0.72), grossOf = x => Number(x.price_usd || 0);
    const since = Date.now() - 30 * 864e5, m = rows.filter(x => new Date(x.purchased_at).getTime() >= since);
    h += `<h3>💰 الأرباح</h3>` + cardsHtml([
      ["صافي لجيبتك (تقريباً)", usd(rows.reduce((t, x) => t + netOf(x), 0)), "بعد عمولة Apple والضريبة، قبل ضريبة الدخل"],
      ["المبيعات الكلية", usd(rows.reduce((t, x) => t + grossOf(x), 0)), `${num(rows.length)} عملية شراء`],
      ["آخر 30 يوم", usd(m.reduce((t, x) => t + netOf(x), 0)), `${num(m.length)} عملية · مبيعات ${usd(m.reduce((t, x) => t + grossOf(x), 0))}`],
    ]) + `<p class="muted">الشراء التجريبي (Apple) مش محسوب. الأرقام بتنحفظ تلقائياً من كل عملية شراء جديدة.</p>`;
  }
  h += ce || !cfg ? `<div class="card"><b>الوضع المجاني</b><p class="muted">شغّل supabase/migration-5-free-mode.sql عشان يظهر هاد الخيار.</p></div>`
    : `<div class="card"><b>الوضع المجاني: ${cfg.free_mode ? "🟢 شغّال (كل الأسئلة ببلاش)" : "⚪ مطفي (بدها اشتراك)"}</b>
       <p class="muted">لما يكون شغّال، كل طالب مسجّل بيحل كل أسئلة مساره بدون اشتراك.</p>
       <button class="btn" id="fm" style="align-self:flex-start">${cfg.free_mode ? "طفّي الوضع المجاني" : "شغّل الوضع المجاني"}</button></div>`;
  $("st").innerHTML = h; $("st").style.cssText = "display:flex;flex-direction:column;gap:12px";
  if ($("fm")) $("fm").onclick = async () => { await sb.from("app_settings").update({ free_mode: !cfg.free_mode }).eq("id", 1); viewStats(); };
}

start();
</script>
</body>
</html>
